<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First App</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #0056b3; }
        p { font-size: 18px; margin-top: 20px; color: #333; }
    </style>
</head>
<body>
    <h1>Welcome to My First Web App</h1>
    <button id="fetchBtn">Call Backend API</button>
    <p id="responseMsg"></p>

    <script>
        document.getElementById('fetchBtn').addEventListener('click', async () => {
            try {
                // This calls your local backend server running on port 3000
                const response = await fetch('http://localhost:3000/api/hello');
                const data = await response.json();
                document.getElementById('responseMsg').textContent = data.message;
            } catch (error) {
                document.getElementById('responseMsg').textContent = 'Error connecting to backend.';
            }
        });
    </script>
</body>
</html>
